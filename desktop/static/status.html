<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src 'self' file:">
  <title>Sieve</title>
  <style>
    /* Same fonts and tokens as the admin UI (internal/web/styles/theme.css). */
    @font-face { font-family: 'Geist'; src: url('fonts/geist-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: 'JetBrains Mono'; src: url('fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 800; font-display: swap; }

    /* Dark is the default, matching the dashboard. */
    :root {
      --background: #0e0e0d; --card: #161615; --muted: #1e1e1c;
      --border: #2a2a27; --border-strong: #3a3a36;
      --foreground: #f3f0e8; --muted-foreground: #9a9890;
      --destructive: #ec6d63;
      --sans: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--background); color: var(--foreground);
      font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
      display: grid; place-items: center; padding: 16px;
    }
    .card {
      width: 100%; max-width: 440px; padding: 32px;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      text-align: center;
    }
    .mark { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 24px; color: var(--foreground); }
    .mark span { font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: 0.02em; }
    .mark circle { fill: currentColor; }
    /* Starting: the twelve dots pulse in order around the ring. */
    .busy .mark circle { animation: pulse 1.2s ease-in-out infinite; animation-delay: calc(var(--i) * 100ms); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .busy .mark circle { animation: none; } }
    h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 8px; }
    p { color: var(--muted-foreground); margin: 0 0 24px; overflow-wrap: anywhere; }
    p.error {
      color: var(--foreground); text-align: left; font: 12px/1.6 var(--mono);
      background: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px;
    }
    .actions { display: flex; gap: 8px; justify-content: center; }
    /* No buttons while starting: drop the gap they would sit in. */
    #message:has(+ .actions.hidden) { margin-bottom: 0; }
    .hidden { display: none !important; }
    /* Buttons: the landing page's Btn (ink primary, outlined secondary). */
    button {
      display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
      font: 500 13.5px var(--sans); letter-spacing: -0.005em;
      padding: 9px 14px; border-radius: 4px;
      transition: transform 80ms ease, background 120ms ease;
    }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid color-mix(in oklab, var(--foreground) 50%, transparent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } button:active { transform: none; } }
    .primary { background: var(--foreground); color: var(--background); border: 1px solid var(--foreground); }
    .primary:hover { background: color-mix(in oklab, var(--foreground) 88%, var(--background)); }
    .secondary { background: transparent; color: var(--foreground); border: 1px solid var(--border-strong); }
    .secondary:hover { background: var(--muted); }
  </style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <div class="mark" id="spinner" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 22 22">
        <circle style="--i:0" cx="3" cy="3" r="1.3"/><circle style="--i:1" cx="8.3" cy="3" r="1.3"/><circle style="--i:2" cx="13.6" cy="3" r="1.3"/><circle style="--i:3" cx="18.9" cy="3" r="1.3"/>
        <circle style="--i:4" cx="18.9" cy="8.3" r="1.3"/><circle style="--i:5" cx="18.9" cy="13.6" r="1.3"/>
        <circle style="--i:6" cx="18.9" cy="18.9" r="1.3"/><circle style="--i:7" cx="13.6" cy="18.9" r="1.3"/><circle style="--i:8" cx="8.3" cy="18.9" r="1.3"/><circle style="--i:9" cx="3" cy="18.9" r="1.3"/>
        <circle style="--i:10" cx="3" cy="13.6" r="1.3"/><circle style="--i:11" cx="3" cy="8.3" r="1.3"/>
      </svg>
      <span>sieve</span>
    </div>
    <h1 id="title">Starting Sieve…</h1>
    <p id="message">This takes a few seconds.</p>
    <div id="actions" class="actions hidden">
      <button id="restart" class="primary" type="button">Restart</button>
      <button id="logs" class="secondary" type="button">Show log</button>
    </div>
  </main>
  <script>
    const q = new URLSearchParams(location.search);
    const state = q.get('state') || 'starting';
    const msg = q.get('message') || '';
    const $ = (id) => document.getElementById(id);
    const copy = {
      starting: ['Starting Sieve…', 'This takes a few seconds.'],
      crashed: ['Sieve stopped unexpectedly', 'Restarting automatically.'],
      failed: ['Sieve could not start', ''],
      stopped: ['Sieve is stopped', ''],
    }[state] || ['Sieve', ''];
    $('title').textContent = copy[0];
    $('message').textContent = msg || copy[1];
    const busy = state === 'starting' || state === 'crashed';
    document.body.classList.toggle('busy', busy);
    if (state !== 'starting') {
      $('actions').classList.remove('hidden');
      // A server error message is shown as a log line; friendly copy stays prose.
      if (msg) $('message').classList.add('error');
    }
    $('restart').onclick = () => window.sieveDesktop && window.sieveDesktop.restartServer();
    $('logs').onclick = () => window.sieveDesktop && window.sieveDesktop.showLogs();
  </script>
</body>
</html>
