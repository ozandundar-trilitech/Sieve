<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS app icon grid: 824px tile centred on a 1024 canvas, ~22% corner radius. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#ebe7dc"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#d9d3c3" stroke-width="1"/>
  <!-- Sieve mark: 4x4 dot grid with the centre 2x2 removed (landing-page logo, scaled). -->
  <g fill="#161513" transform="translate(512 512) scale(22) translate(-10.95 -10.95)">
    <circle cx="3" cy="3" r="1.3"/><circle cx="8.3" cy="3" r="1.3"/><circle cx="13.6" cy="3" r="1.3"/><circle cx="18.9" cy="3" r="1.3"/>
    <circle cx="3" cy="8.3" r="1.3"/><circle cx="18.9" cy="8.3" r="1.3"/>
    <circle cx="3" cy="13.6" r="1.3"/><circle cx="18.9" cy="13.6" r="1.3"/>
    <circle cx="3" cy="18.9" r="1.3"/><circle cx="8.3" cy="18.9" r="1.3"/><circle cx="13.6" cy="18.9" r="1.3"/><circle cx="18.9" cy="18.9" r="1.3"/>
  </g>
</svg>
