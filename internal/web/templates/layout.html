{{define "head"}}
  <meta name="color-scheme" content="light dark">
  <script>{{themeInit}}</script>
  <link rel="icon" type="image/svg+xml" href="{{asset "favicon.svg"}}">
  <link rel="preload" href="/static/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{asset "admin.css"}}">
{{end}}

{{define "logo"}}
<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" fill="currentColor" class="shrink-0">
  <circle cx="3" cy="3" r="1.3"/><circle cx="8.3" cy="3" r="1.3"/><circle cx="13.6" cy="3" r="1.3"/><circle cx="18.9" cy="3" r="1.3"/>
  <circle cx="3" cy="8.3" r="1.3"/><circle cx="18.9" cy="8.3" r="1.3"/>
  <circle cx="3" cy="13.6" r="1.3"/><circle cx="18.9" cy="13.6" r="1.3"/>
  <circle cx="3" cy="18.9" r="1.3"/><circle cx="8.3" cy="18.9" r="1.3"/><circle cx="13.6" cy="18.9" r="1.3"/><circle cx="18.9" cy="18.9" r="1.3"/>
</svg>
{{end}}

{{define "error-card"}}
<div class="error-card">
  <p class="eyebrow">Error {{.Status}}</p>
  <h1 class="error-title">{{.Title}}</h1>
  {{if .Message}}<pre class="error-message">{{.Message}}</pre>{{end}}
  <div class="flex flex-wrap gap-2">
    <button type="button" id="error-back" class="btn btn-outline" onclick="window.history.back()">Go back</button>
    <a href="/" class="btn btn-primary">Home</a>
  </div>
</div>
{{end}}
